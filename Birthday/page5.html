<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Flower For You 💐</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  body{ cursor:pointer; user-select:none; -webkit-user-select:none; }
 
  .stage{ max-width: 420px; }
  .card{ max-width: 420px; padding: 34px 26px 30px; }
 
  .flower-title{
    font-family:'Fredoka', sans-serif;
    font-size: 1.3rem;
    color: var(--text-deep);
    margin-bottom: 4px;
  }
 
  .flower-title .script{
    font-family:'Caveat', cursive;
    font-size: 1.9rem;
    color: var(--accent-1);
    font-weight:700;
    display:block;
    line-height:1.1;
    margin-top: 2px;
  }
 
  .flower-subtitle{
    font-size: 0.85rem;
    color: var(--text-soft);
    margin: 6px 0 14px;
    min-height: 1.3em;
  }
 
  /* ---------- scene ---------- */
  .hero-scene{
    position:relative;
    width: 100%;
    max-width: 260px;
    height: 250px;
    margin: 0 auto 6px;
    overflow: visible;
  }
 
  .web-anchor{
    position:absolute;
    top:0;
    left: 62%;
    width: 3px;
    height: 3px;
    border-radius:50%;
    background: rgba(122,37,69,0.35);
    transform: translateX(-50%);
  }
 
  .web-string{
    position:absolute;
    top:0;
    left: 62%;
    width: 2px;
    height: 96px;
    background: linear-gradient(to bottom, rgba(122,37,69,0.5), rgba(122,37,69,0.15));
    transform: translateX(-50%) scaleY(0);
    transform-origin: top center;
    transition: transform 1s cubic-bezier(.3,.9,.35,1);
  }
 
  .web-string.drop{ transform: translateX(-50%) scaleY(1); }
 
  /* ---------- hero ---------- */
  .hero-figure{
    position:absolute;
    top: 0;
    left: 62%;
    width: 108px;
    height: 108px;
    transform: translate(-50%, -190px) rotate(-4deg);
    transition: transform 1.05s cubic-bezier(.22,.85,.3,1.25);
  }
 
  .hero-figure.descend{
    transform: translate(-50%, 84px) rotate(2deg);
  }
 
  .hero-figure.landed{
    animation: heroSway 2.2s ease-in-out infinite;
  }
 
  .hero-figure.deliver{
    animation: none;
    transform: translate(-70%, 84px) rotate(-6deg);
  }
 
  @keyframes heroSway{
    0%, 100% { transform: translate(-50%, 84px) rotate(2deg); }
    50% { transform: translate(-50%, 84px) rotate(-3deg); }
  }
 
  .hero-figure svg{ width:100%; height:100%; overflow:visible; }
 
  .hero-arm{
    transform-box: fill-box;
    transform-origin: top center;
    transition: transform 0.5s ease;
  }
 
  .hero-figure.deliver .hero-arm{
    transform: rotate(-38deg);
  }
 
  .hero-flower{
    transform-box: fill-box;
    transform-origin: center;
    opacity:1;
    transition: opacity 0.5s ease 0.15s, transform 0.6s cubic-bezier(.3,.8,.3,1.2) 0.15s;
  }
 
  .hero-figure.deliver .hero-flower{
    opacity:0;
    transform: translate(-46px, 30px) scale(0.7);
  }
 
  /* ---------- kitty ---------- */
  .kitty-wrap{
    position:absolute;
    left: 8%;
    bottom: 10px;
    width: 140px;
    height: 120px;
  }
 
  .kitty-wrap svg{ width:100%; height:100%; overflow:visible; }
 
  .kitty-tail{
    transform-box: fill-box;
    transform-origin: 78px 92px;
    animation: tailWag 1.8s ease-in-out infinite;
  }
 
  @keyframes tailWag{
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-14deg); }
  }
 
  .kitty-body{
    animation: catBob 2.4s ease-in-out infinite;
    transform-origin: center bottom;
  }
 
  @keyframes catBob{
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
 
  .kitty-flower{
    transform-box: fill-box;
    transform-origin: center;
    opacity:0;
    transform: scale(0.5) translateY(6px);
    transition: opacity 0.5s ease, transform 0.5s cubic-bezier(.2,.9,.3,1.4);
  }
 
  .kitty-wrap.receive .kitty-flower{
    opacity:1;
    transform: scale(1) translateY(0);
  }
 
  .blush-mark{
    opacity:0;
    transform: scale(0.4);
    transform-box: fill-box;
    transform-origin: center;
    transition: opacity 0.4s ease, transform 0.4s cubic-bezier(.3,.8,.3,1.3);
  }
 
  .kitty-wrap.blush .blush-mark{
    opacity:0.85;
    transform: scale(1);
  }
 
  .mini-heart{
    animation: floatHeart 3s ease-in-out infinite;
    opacity:0;
  }
 
  .kitty-wrap.blush .mini-heart{ animation-play-state: running; }
 
  @keyframes floatHeart{
    0%   { transform: translateY(6px) scale(0.6); opacity:0; }
    30%  { opacity:0.9; }
    100% { transform: translateY(-26px) scale(1); opacity:0; }
  }
 
  .tap-hint{
    font-size: 0.85rem;
    color: var(--text-soft);
    animation: hintPulse 1.6s ease-in-out infinite;
    min-height: 1.3em;
    margin-top: 4px;
  }
 
  @keyframes hintPulse{
    0%, 100% { opacity:0.6; }
    50% { opacity:1; }
  }
 
  .greeting-wrap{
    display:none;
    margin-top: 10px;
  }
 
  .greeting-wrap.show{
    display:block;
    animation: greetPop 0.6s cubic-bezier(.2,.8,.3,1.3) both;
  }
 
  @keyframes greetPop{
    from{ opacity:0; transform: scale(0.75); }
    to{ opacity:1; transform: scale(1); }
  }
 
  .greeting-text{
    font-family:'Caveat', cursive;
    font-size: 1.9rem;
    color: var(--accent-1);
    line-height:1.15;
    margin-bottom: 4px;
  }
 
  .greeting-sub{
    font-size: 0.86rem;
    color: var(--text-soft);
    line-height:1.4;
  }
 
  .action-row{
    display:none;
    gap: 10px;
    justify-content:center;
    margin-top: 18px;
  }
 
  .action-row.show{ display:flex; }
 
  .replay-btn, .back-btn{
    padding: 10px 18px;
    border-radius: 999px;
    font-family:'Quicksand', sans-serif;
    font-weight:700;
    font-size: 0.8rem;
    cursor:pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
 
  .replay-btn{
    border:none;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    color:#fff;
    box-shadow: 0 8px 16px rgba(236,95,138,0.35);
  }
 
  .back-btn{
    border: 1.5px solid rgba(163,72,106,0.35);
    background: rgba(255,255,255,0.4);
    color: var(--text-deep);
    text-decoration:none;
    display:inline-flex;
    align-items:center;
  }
 
  .replay-btn:hover, .back-btn:hover{ transform: translateY(-2px); }
 
  @media (prefers-reduced-motion: reduce){
    .hero-figure.landed{ animation:none; }
    .tap-hint{ animation:none; }
    .mini-heart{ animation:none; }
  }
</style>
</head>

<script src="shared.js"></script>
<script>
  const sceneNote   = document.getElementById('sceneNote');
  const tapHint     = document.getElementById('tapHint');
  const webString   = document.getElementById('webString');
  const heroFigure  = document.getElementById('heroFigure');
  const kittyWrap   = document.getElementById('kittyWrap');
  const greetingWrap= document.getElementById('greetingWrap');
  const actionRow   = document.getElementById('actionRow');
  const replayBtn   = document.getElementById('replayBtn');
 
  let played = false;
  let timers = [];
 
  function clearTimers(){
    timers.forEach(t => clearTimeout(t));
    timers = [];
  }
 
  function playScene(){
    if(played) return;
    played = true;
    tapHint.style.display = 'none';
    sceneNote.textContent = 'Someone heard you needed cheering up...';
 
    webString.classList.add('drop');
    heroFigure.classList.add('descend');
 
    timers.push(setTimeout(() => {
      heroFigure.classList.add('landed');
      sceneNote.textContent = 'He made it just in time 🕸️';
    }, 1050));
 
    timers.push(setTimeout(() => {
      heroFigure.classList.add('deliver');
      kittyWrap.classList.add('receive');
      sceneNote.textContent = 'For you, my love 💐';
    }, 1750));
 
    timers.push(setTimeout(() => {
      kittyWrap.classList.add('blush');
    }, 2450));
 
    timers.push(setTimeout(() => {
      greetingWrap.classList.add('show');
      actionRow.classList.add('show');
    }, 2950));
  }
 
  function resetScene(){
    clearTimers();
    played = false;
    webString.classList.remove('drop');
    heroFigure.classList.remove('descend', 'landed', 'deliver');
    kittyWrap.classList.remove('receive', 'blush');
    greetingWrap.classList.remove('show');
    actionRow.classList.remove('show');
    tapHint.style.display = '';
    sceneNote.textContent = 'Tap the screen and watch closely...';
  }
 
  document.body.addEventListener('click', function(e){
    if(e.target.closest('.action-row')) return;
    playScene();
  });
  document.body.addEventListener('touchstart', function(e){
    if(e.target.closest('.action-row')) return;
    e.preventDefault();
    playScene();
  }, { passive:false });
 
  replayBtn.addEventListener('click', function(e){
    e.stopPropagation();
    resetScene();
  });
</script>
 
</body>
</html>
