<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello, my love 💕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  .card{ position:relative; overflow:visible; }
 
  .song-pill{
    position:absolute;
    top: -18px;
    right: 20px;
    display:flex;
    align-items:center;
    gap:6px;
    padding: 8px 16px;
    border-radius: 999px;
    border:none;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    color:#fff;
    font-family:'Quicksand', sans-serif;
    font-weight:700;
    font-size: 0.78rem;
    cursor:pointer;
    box-shadow: 0 8px 16px rgba(236,95,138,0.4);
    transition: transform 0.15s ease;
  }
 
  .song-pill:hover{ transform: translateY(-2px) scale(1.03); }
  .song-pill .note{ font-size:0.9rem; }
 
  .cat-wrap{
    width: 130px;
    height: 110px;
    margin: 10px auto 6px;
    position:relative;
  }
 
  .cat-wrap svg{ width:100%; height:100%; overflow:visible; }
 
  .cat-tail{
    transform-origin: 78px 92px;
    animation: tailWag 1.8s ease-in-out infinite;
  }
 
  @keyframes tailWag{
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-14deg); }
  }
 
  .cat-body{
    animation: catBob 2.4s ease-in-out infinite;
    transform-origin: center bottom;
  }
 
  @keyframes catBob{
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
 
  .cat-heart{
    animation: heartBeat 1.1s ease-in-out infinite;
    transform-origin: center;
  }
 
  @keyframes heartBeat{
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
  }
 
  .mini-heart{
    animation: floatHeart 3s ease-in-out infinite;
    opacity:0;
  }
 
  @keyframes floatHeart{
    0%   { transform: translateY(6px) scale(0.6); opacity:0; }
    30%  { opacity:0.9; }
    100% { transform: translateY(-30px) scale(1); opacity:0; }
  }
 
  .greeting-title{
    font-family:'Fredoka', sans-serif;
    font-size: 1.4rem;
    color: var(--text-deep);
    margin-bottom: 4px;
  }
 
  .greeting-title .script{
    font-family:'Caveat', cursive;
    font-size: 2rem;
    color: var(--accent-1);
    font-weight:700;
    display:block;
    line-height:1;
    margin-top: 2px;
  }
 
  .greeting-question{
    font-size: 0.98rem;
    color: var(--text-soft);
    margin: 18px 0 26px;
    line-height:1.5;
  }
 
  .choice-row{
    display:flex;
    gap: 12px;
    justify-content:center;
    position:relative;
    min-height: 54px;
  }
 
  .yes-btn, .no-btn{
    padding: 13px 22px;
    border-radius: 999px;
    font-family:'Quicksand', sans-serif;
    font-weight:700;
    font-size: 0.92rem;
    cursor:pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
 
  .yes-btn{
    border:none;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    color:#fff;
    box-shadow: 0 10px 20px rgba(236,95,138,0.4);
    flex: 1;
  }
 
  .yes-btn:hover{ transform: translateY(-2px); box-shadow: 0 14px 24px rgba(236,95,138,0.48); }
 
  .no-btn{
    border: 1.5px solid rgba(163,72,106,0.35);
    background: rgba(255,255,255,0.4);
    color: var(--text-deep);
    position:relative;
  }
 
  .no-btn.dodging{ position:absolute; }
 
  .tease-msg{
    font-size:0.78rem;
    color: var(--text-soft);
    margin-top:14px;
    min-height: 18px;
  }
</style>
</head>
<body>
 
  <div class="marble-wrap" aria-hidden="true">
    <div class="marble-bg"></div>
    <div class="marble-sheen"></div>
  </div>
 
  <div class="butterfly-field" aria-hidden="true"></div>
  <div class="floaters" id="floaters" aria-hidden="true"></div>
  <div class="butterflies" id="butterflies" aria-hidden="true"></div>
 
  <div class="stage">
    <main class="card" id="page2" role="main">
      <button class="song-pill" id="songBtn" type="button">
        <span class="note" id="songIcon">🎵</span>
        <span id="songLabel">Play Our Song</span>
      </button>
      <audio id="bgSong" loop preload="none">
        <source src="song.mp3" type="audio/mpeg">
      </audio>
 
      <div class="cat-wrap" aria-hidden="true">
        <svg viewBox="0 0 130 110" style="position:absolute; inset:0;">
          <path class="mini-heart" style="animation-delay:0s"   d="M96 30 c-2-4-8-4-9 1 c-1-5-7-5-9-1 c-2 4 1 8 9 13 c8-5 11-9 9-13 Z" fill="#f78fb0"/>
          <path class="mini-heart" style="animation-delay:1s"   d="M108 46 c-1.5-3-6-3-6.5 0.5 c-0.5-3.5-5-3.5-6.5-0.5 c-1.5 3 0.5 6 6.5 9.5 c6-3.5 8-6.5 6.5-9.5 Z" fill="#f2a8c1"/>
          <path class="mini-heart" style="animation-delay:2s"   d="M84 18 c-1-2-4.5-2-5 0.5 c-0.5-2.5-4-2.5-5 -0.5 c-1 2 0.5 4.5 5 7 c4.5-2.5 6-5 5-7 Z" fill="#f2a8c1"/>
        </svg>
 
        <svg class="cat-body" viewBox="0 0 130 110" xmlns="http://www.w3.org/2000/svg">
          <path class="cat-tail" d="M78 92 C100 96, 108 78, 96 66" stroke="#f3b6cb" stroke-width="9" stroke-linecap="round" fill="none"/>
          <ellipse cx="55" cy="78" rx="30" ry="20" fill="#fbdfe9"/>
          <circle cx="52" cy="42" r="28" fill="#fdeaf1"/>
          <path d="M28 26 L20 6 L42 20 Z" fill="#fdeaf1"/>
          <path d="M76 26 L86 6 L62 20 Z" fill="#fdeaf1"/>
          <path d="M30 22 L26 12 L38 19 Z" fill="#f3b6cb"/>
          <path d="M74 22 L80 12 L66 19 Z" fill="#f3b6cb"/>
          <path class="cat-heart" style="animation-delay:0s" d="M42 40 c-1.4-3-6.4-3-7 1 c-0.6-4-5.6-4-7 -1 c-1.4 3 0.6 6.4 7 10.4 c6.4-4 8.4-7.4 7-10.4 Z" fill="#ec5f8a"/>
          <path class="cat-heart" style="animation-delay:0.3s" d="M76 40 c-1.4-3-6.4-3-7 1 c-0.6-4-5.6-4-7 -1 c-1.4 3 0.6 6.4 7 10.4 c6.4-4 8.4-7.4 7-10.4 Z" fill="#ec5f8a"/>
          <path d="M59 52 l-3 3 -3 -3 Z" fill="#e0708f"/>
          <path d="M56 55 Q52 60 47 56 M56 55 Q60 60 65 56" stroke="#c9587a" stroke-width="1.6" fill="none" stroke-linecap="round"/>
          <path d="M20 42 L36 44 M20 50 L36 48 M68 44 L84 42 M68 48 L84 50" stroke="#e6a9bd" stroke-width="1.3" stroke-linecap="round"/>
          <ellipse cx="38" cy="96" rx="8" ry="6" fill="#fdeaf1"/>
          <ellipse cx="70" cy="96" rx="8" ry="6" fill="#fdeaf1"/>
        </svg>
      </div>
 
      <h1 class="greeting-title">Hello<span class="script">my love! 💕</span></h1>
      <p class="greeting-question">Do you want to see your birthday gift?</p>
 
      <div class="choice-row" id="choiceRow">
        <button type="button" class="yes-btn" id="yesBtn">Yes Please</button>
        <button type="button" class="no-btn" id="noBtn">No Thanks</button>
      </div>
 
      <p class="tease-msg" id="teaseMsg"></p>
    </main>
  </div>
 
<script src="shared.js"></script>
<script>
  // ---- Play Our Song ----
  const songBtn = document.getElementById('songBtn');
  const songIcon = document.getElementById('songIcon');
  const songLabel = document.getElementById('songLabel');
  const song = document.getElementById('bgSong');
  let isPlaying = false;
 
  songBtn.addEventListener('click', function(){
    if(!isPlaying){
      song.play().then(() => {
        isPlaying = true;
        songIcon.textContent = '⏸';
        songLabel.textContent = 'Pause Song';
      }).catch(() => {
        songLabel.textContent = 'Add song.mp3 to play';
      });
    } else {
      song.pause();
      isPlaying = false;
      songIcon.textContent = '🎵';
      songLabel.textContent = 'Play Our Song';
    }
  });
 
  // ---- Yes / No buttons ----
  const yesBtn = document.getElementById('yesBtn');
  const noBtn = document.getElementById('noBtn');
  const choiceRow = document.getElementById('choiceRow');
  const teaseMsg = document.getElementById('teaseMsg');
 
  const teases = [
    "Aww, are you sure? 🥺",
    "Come on, you know you want to 🎁",
    "It's a good one, I promise 💝",
    "Okay okay, just try the other button 😉"
  ];
  let dodgeCount = 0;
  const maxDodges = 4;
 
  function dodgeNoButton(){
    if(dodgeCount >= maxDodges) return;
    dodgeCount++;
 
    if(dodgeCount === maxDodges){
      // Final dodge used up — settle back into the normal layout
      // instead of staying absolutely positioned (which caused it
      // to float on top of the Yes button).
      noBtn.classList.remove('dodging');
      noBtn.style.left = '';
      noBtn.style.top = '';
      teaseMsg.textContent = "Alright, I'll stop running — but the yes button is right there 🩷";
      return;
    }
 
    const rowRect = choiceRow.getBoundingClientRect();
    const btnRect = noBtn.getBoundingClientRect();
    const maxX = rowRect.width - btnRect.width;
    const maxY = 40;
 
    const newX = Math.random() * Math.max(maxX, 0);
    const newY = (Math.random() - 0.5) * maxY;
 
    noBtn.classList.add('dodging');
    noBtn.style.left = newX + 'px';
    noBtn.style.top = newY + 'px';
 
    teaseMsg.textContent = teases[Math.min(dodgeCount - 1, teases.length - 1)];
  }
 
  noBtn.addEventListener('mouseenter', dodgeNoButton);
  noBtn.addEventListener('click', dodgeNoButton);
 
  yesBtn.addEventListener('click', function(){
    yesBtn.textContent = "Opening your gift... 🎁";
    yesBtn.disabled = true;
    teaseMsg.textContent = "";
    setTimeout(() => {
      window.location.href = 'page3.html';
    }, 900);
  });
</script>
 
</body>
</html>
